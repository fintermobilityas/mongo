name: Publish image

# Builds ./8.0 once with the build arguments of publish.ps1, checks the
# Enterprise package inventory and `mongod --version` of that image, and gives
# its digest the tag ghcr.io/fintermobilityas/mongo-enterprise:<MongoVersion>
# with this job's token.
#
# - A push to a finter-* branch that changes publish.ps1 or 8.0/Dockerfile publishes.
# - workflow_dispatch builds and checks only, unless the `push` input is true.
# - A pull request builds and checks only.
#
# The job never creates a package, never changes a package's visibility and
# never overwrites a published tag.

on:
  push:
    branches:
      - 'finter-*'
    paths:
      - publish.ps1
      - 8.0/Dockerfile
  pull_request:
    paths:
      - publish.ps1
      - 8.0/Dockerfile
      - .github/workflows/publish.yml
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to ghcr.io (false builds and checks only)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# Every publishing run, from any ref, shares one group, so the tag check and
# the push of one run finish before the next run checks its tag. Dry runs only
# queue behind dry runs of the same ref. GitHub keeps one pending run per
# group: a third publishing run cancels the pending one, which then needs a
# new dispatch with push=true.
concurrency:
  group: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push)) && 'publish-image' || format('publish-image-dry-run-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, check and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE: ghcr.io/fintermobilityas/mongo-enterprise
      PUSH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push) }}
      # Same image labels as a local `docker buildx build` from a git checkout.
      BUILDX_GIT_LABELS: full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the build arguments from publish.ps1
        shell: pwsh
        run: |
          $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path publish.ps1).Path, [ref]$null, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw "publish.ps1 does not parse: $($parseErrors -join '; ')" }

          $defaults = @{}
          foreach ($parameter in $ast.ParamBlock.Parameters) {
            $value = if ($parameter.DefaultValue) { [string]$parameter.DefaultValue.SafeGetValue() } else { '' }
            $defaults[$parameter.Name.VariablePath.UserPath] = $value
          }

          $names = [ordered]@{
            MongoVersion        = 'VERSION'
            MongoPackageVersion = 'PACKAGE_VERSION'
            MongoAptChannel     = 'APT_CHANNEL'
            MongoMongoshChannel = 'MONGOSH_CHANNEL'
          }
          foreach ($name in $names.Keys) {
            if (-not $defaults.ContainsKey($name)) { throw "publish.ps1 has no `$$name parameter" }
            if ($defaults[$name] -notmatch '^[0-9A-Za-z.~+-]*$') { throw "Unexpected `$$name default: '$($defaults[$name])'" }
            "$($names[$name])=$($defaults[$name])" >> $env:GITHUB_ENV
            "$name = $($defaults[$name])"
          }
          if (-not $defaults.MongoVersion) { throw 'publish.ps1 has an empty $MongoVersion' }

      - name: Check that 8.0/Dockerfile matches publish.ps1
        run: |
          dockerfile_version=$(sed -n 's/^ARG MONGO_VERSION=//p' 8.0/Dockerfile)
          if [ "$dockerfile_version" != "$PACKAGE_VERSION" ]; then
            echo "::error::8.0/Dockerfile has ARG MONGO_VERSION=$dockerfile_version, publish.ps1 has \$MongoPackageVersion = $PACKAGE_VERSION"
            exit 1
          fi

          # The same arguments, in the same order, as publish.ps1 passes to docker build.
          : > "$RUNNER_TEMP/build-args"
          if [ -n "$PACKAGE_VERSION" ]; then printf '%s\n' --build-arg "MONGO_VERSION=$PACKAGE_VERSION" >> "$RUNNER_TEMP/build-args"; fi
          if [ -n "$APT_CHANNEL" ]; then printf '%s\n' --build-arg "MONGO_MAJOR=$APT_CHANNEL" >> "$RUNNER_TEMP/build-args"; fi
          if [ -n "$MONGOSH_CHANNEL" ]; then printf '%s\n' --build-arg "MONGOSH_CHANNEL=$MONGOSH_CHANNEL" >> "$RUNNER_TEMP/build-args"; fi
          cat "$RUNNER_TEMP/build-args"

      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to create a package or overwrite a tag
        if: env.PUSH == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repository=${IMAGE#ghcr.io/}
          access_hint="The package must already exist, and its Manage Actions access must give ${GITHUB_REPOSITORY} the Write role. This workflow never creates a package."

          if ! token=$(curl -fsS -K - "https://ghcr.io/token?service=ghcr.io&scope=repository:${repository}:pull" \
            <<<"user = \"${GITHUB_ACTOR}:${GITHUB_TOKEN}\"" | jq -er .token); then
            echo "::error::ghcr.io refused a pull token for ${IMAGE}. ${access_hint}"
            exit 1
          fi

          status=$(curl -sS -o "$RUNNER_TEMP/tags.json" -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" "https://ghcr.io/v2/${repository}/tags/list?n=10000")
          if [ "$status" != 200 ]; then
            echo "::error::Cannot list the tags of ${IMAGE} (HTTP ${status}). ${access_hint}"
            exit 1
          fi

          if jq -e --arg tag "$VERSION" 'any((.tags // [])[]; . == $tag)' "$RUNNER_TEMP/tags.json" > /dev/null; then
            echo "::error::${IMAGE}:${VERSION} already exists. Published tags are never overwritten; bump the version in publish.ps1 and 8.0/Dockerfile."
            exit 1
          fi
          echo "${IMAGE}:${VERSION} is not published yet."

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ./8.0
        run: |
          mapfile -t build_args < "$RUNNER_TEMP/build-args"
          if [ "$PUSH" = true ]; then
            # Build once and push the image without a tag. The checks below run
            # this exact image, and only then does its digest get the tag.
            # A run that fails a check leaves an untagged version in the package.
            docker buildx build "${build_args[@]}" --platform linux/amd64 --provenance=mode=min \
              --output "type=image,name=${IMAGE},push-by-digest=true,push=true" \
              --metadata-file "$RUNNER_TEMP/metadata.json" ./8.0
            digest=$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/metadata.json")
            docker pull --platform linux/amd64 "${IMAGE}@${digest}"
            echo "DIGEST=${digest}" >> "$GITHUB_ENV"
            echo "CHECK_IMAGE=${IMAGE}@${digest}" >> "$GITHUB_ENV"
          else
            docker buildx build "${build_args[@]}" --platform linux/amd64 --load \
              -t "mongo-enterprise:${VERSION}" ./8.0
            echo "CHECK_IMAGE=mongo-enterprise:${VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Check the package inventory
        run: |
          docker run --rm --entrypoint dpkg-query "$CHECK_IMAGE" \
            -W '-f=${Package} ${db:Status-Status} ${Version}\n' \
            mongodb-enterprise mongodb-enterprise-database mongodb-enterprise-server \
            mongodb-enterprise-shell mongodb-enterprise-mongos mongodb-enterprise-tools \
            mongodb-enterprise-database-tools-extra mongodb-enterprise-cryptd mongodb-mongosh \
            | tee "$RUNNER_TEMP/packages.txt"

          # Only packages in the "installed" state count: dpkg-query also lists a
          # removed package that kept its configuration files.
          # cryptd and mongosh have their own version numbers; the rest are pinned by the Dockerfile.
          for package in mongodb-enterprise mongodb-enterprise-database mongodb-enterprise-server \
            mongodb-enterprise-shell mongodb-enterprise-mongos mongodb-enterprise-tools \
            mongodb-enterprise-database-tools-extra; do
            installed=$(awk -v p="$package" '$1 == p && $2 == "installed" { print $3 }' "$RUNNER_TEMP/packages.txt")
            if [ "$installed" != "$PACKAGE_VERSION" ]; then
              echo "::error::${package} is '${installed}', expected ${PACKAGE_VERSION}"
              exit 1
            fi
          done
          for package in mongodb-enterprise-cryptd mongodb-mongosh; do
            if [ -z "$(awk -v p="$package" '$1 == p && $2 == "installed" { print $3 }' "$RUNNER_TEMP/packages.txt")" ]; then
              echo "::error::${package} is not installed"
              exit 1
            fi
          done

      - name: Check mongod --version
        run: |
          output=$(docker run --rm -e GLIBC_TUNABLES=glibc.pthread.rseq=1 "$CHECK_IMAGE" mongod --version)
          echo "$output"

          build_info=$(awk 'started; /^Build Info: /{ sub(/^Build Info: /, ""); print; started = 1 }' <<<"$output")
          # The exact version, or the version followed by a pre-release suffix
          # such as -rc0. 9.0.4 does not accept 9.0.40.
          if ! jq -e --arg version "$VERSION" \
            '(.version == $version or (.version | startswith($version + "-"))) and any((.modules // [])[]; . == "enterprise")' \
            <<<"$build_info" > /dev/null; then
            echo "::error::mongod does not report version ${VERSION} with the enterprise module"
            exit 1
          fi
          mongod_version=$(jq -r .version <<<"$build_info")
          echo "mongod reports ${mongod_version} with the enterprise module"
          echo "MONGOD_VERSION=${mongod_version}" >> "$GITHUB_ENV"

      - name: Check the provenance and tag the checked image
        if: env.PUSH == 'true'
        run: |
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}"
          provenance=$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .Provenance}}')
          echo "$provenance" | jq .
          revision=$(jq -r '.SLSA.runDetails.metadata.buildkit_metadata.vcs.revision
            // .SLSA.metadata."https://mobyproject.org/buildkit@v1#metadata".vcs.revision
            // empty' <<<"$provenance")
          echo "Provenance source revision: ${revision:-missing}"
          if [ "$revision" != "$GITHUB_SHA" ]; then
            echo "::error::The provenance of ${DIGEST} records revision '${revision:-missing}', expected ${GITHUB_SHA}; the tag was not set"
            exit 1
          fi

          # One source image index: imagetools makes an exact copy, so the tag
          # points at the digest that passed the checks.
          docker buildx imagetools create -t "${IMAGE}:${VERSION}" "${IMAGE}@${DIGEST}"
          tagged=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          if [ "$tagged" != "$DIGEST" ]; then
            echo "::error::${IMAGE}:${VERSION} points at ${tagged}, expected the checked ${DIGEST}"
            exit 1
          fi
          echo "Published ${IMAGE}:${VERSION}@${DIGEST}"

          {
            echo "### Published ${IMAGE}:${VERSION}"
            echo
            echo "- Reference: \`${IMAGE}:${VERSION}@${DIGEST}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- mongod: \`${MONGOD_VERSION}\`"
            echo "- Provenance source revision: \`${revision}\` (this run: \`${GITHUB_SHA}\`)"
            echo "- Packages:"
            sed 's/^/  - /' "$RUNNER_TEMP/packages.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize the dry run
        if: env.PUSH != 'true'
        run: |
          {
            echo "### Dry run of ${IMAGE}:${VERSION}, nothing pushed"
            echo
            echo "- mongod: \`${MONGOD_VERSION}\`"
            echo "- Packages:"
            sed 's/^/  - /' "$RUNNER_TEMP/packages.txt"
          } >> "$GITHUB_STEP_SUMMARY"
